name: "Say Less Guild"
description: |
  ⚔️ – We Mutinied Against Micro-Management, Now We Want Cutting Edge.
  📜 The Backstory:
  Yes, we used to be in a "Cutting Edge" guild. We got entirely fed up with being micro-managed down to the exact pixel, treating a video game like a corporate board meeting.
  So, we did what any rational group of gamers would do: we mutinied, jumped ship, and formed Say Less .
  The philosophy is in the name. Less talking, less pixel-perfect micro-management, less spreadsheet nonsense more killing bosses and pulling big numbers.

